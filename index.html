<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юрист-ассистент банка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a3a5c; color: white; padding: 16px 24px; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
        .chat-container { flex: 1; display: flex; overflow: hidden; }
        .chat-main { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; }
        .messages { flex: 1; overflow-y: auto; padding: 24px; }
        .message { margin-bottom: 20px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .user .bubble { background: #1a3a5c; color: white; border-bottom-right-radius: 4px; }
        .assistant .bubble { background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
        .sources { margin-top: 10px; width: 100%; }
        .sources-title { font-size: 12px; color: #666; margin-bottom: 6px; cursor: pointer; }
        .source-item { background: #f0f4f8; border-radius: 6px; padding: 10px; margin-bottom: 6px; font-size: 13px; cursor: pointer; }
        .source-item:hover { background: #e2e8f0; }
        .source-header { font-weight: 600; color: #1a3a5c; margin-bottom: 4px; }
        .source-text { color: #444; line-height: 1.5; max-height: 80px; overflow: hidden; position: relative; }
        .source-text.expanded { max-height: none; }
        .input-area { padding: 16px 24px; background: white; border-top: 1px solid #e0e0e0; }
        .input-row { display: flex; gap: 12px; max-width: 800px; margin: 0 auto; }
        .input-row input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        .input-row input:focus { border-color: #1a3a5c; }
        .input-row button { padding: 12px 24px; background: #1a3a5c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { display: none; text-align: center; padding: 20px; color: #666; }
        .loading.active { display: block; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ccc; border-top-color: #1a3a5c; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚖️ Юрист-ассистент банка</h1>
        <p>Поиск по нормативным документам с подтверждением источников</p>
    </div>

    <div class="chat-container">
        <div class="chat-main">
            <div class="messages" id="messages">
                <div class="message assistant">
                    <div class="bubble">
                        Здравствуйте! Я помогу найти применимые нормы в базе знаний банка. Задайте вопрос — я отвечу со ссылками на конкретные положения. Если информации в базе недостаточно, я прямо об этом сообщу.
                    </div>
                </div>
            </div>
            <div class="loading" id="loading"><span class="spinner"></span> Поиск по базе знаний…</div>
            <div class="input-area">
                <div class="input-row">
                    <input type="text" id="input" placeholder="Например: какие требования к правоспособности заёмщика при кредитовании?" autocomplete="off">
                    <button id="send" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let history = [];

        function addMessage(role, content, sources) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = `<div class="bubble">`;
            html += content;
            html += `</div>`;

            if (sources && sources.length > 0 && role === 'assistant') {
                html += `<div class="sources"><div class="sources-title" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">📎 Источники (${sources.length}) — нажмите, чтобы показать/скрыть</div><div style="display:none">`;
                sources.forEach((s) => {
                    html += `<div class="source-item" onclick="this.querySelector('.source-text').classList.toggle('expanded')">
                        <div class="source-header">📄 ${s.doc} ${s.status ? '('+s.status+')' : ''}</div>
                        <div class="source-text">${s.text}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }

            div.innerHTML = html;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const question = input.value.trim();
            if (!question) return;

            input.value = '';
            addMessage('user', question);
            document.getElementById('loading').classList.add('active');
            document.getElementById('send').disabled = true;

            // Собираем историю в формате, который ждет app.py
            const messages = history.concat([{ role: 'user', content: question }]);

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messages }), // Отправляем messages
                });
                const data = await resp.json();
                
                if (!resp.ok) throw new Error(data.detail || "Ошибка сервера");

                addMessage('assistant', data.answer, data.sources);
                
                history.push({ role: 'user', content: question });
                history.push({ role: 'assistant', content: data.answer });
                if (history.length > 8) history = history.slice(-8);
            } catch (e) {
                addMessage('assistant', 'Ошибка: ' + e.message, [], 'error');
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('send').disabled = false;
                input.focus();
            }
        }

        document.getElementById('input').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
